<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Josie Tracker</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
</head>
<body>
  <div class="container">
    <header>
      <h1>🐕 Josie Tracker</h1>
      <div class="header-actions">
        <button id="export-btn" class="icon-btn" title="Export data">📥</button>
        <button id="date-picker-btn" class="icon-btn" title="Change date">📅</button>
      </div>
    </header>

    <!-- Navigation -->
    <nav class="nav-tabs">
      <button id="today-nav" class="nav-tab active" onclick="event.stopPropagation()">Today</button>
      <button id="history-nav" class="nav-tab" onclick="event.stopPropagation()">History</button>
      <button id="analytics-nav" class="nav-tab" onclick="event.stopPropagation()">Analytics</button>
    </nav>

    <!-- Today Page -->
    <div id="today-page" class="page" style="display: block;">

    <!-- Quick Add Buttons -->
    <section class="quick-add">
      <button class="activity-btn potty-btn" data-type="potty" data-modal="potty-modal">
        <span class="emoji">🚽</span>
        <span>Potty</span>
      </button>
      <button class="activity-btn vomit-btn" data-type="vomit" data-modal="vomit-modal">
        <span class="emoji">🤢</span>
        <span>Vomit</span>
      </button>
      <button class="activity-btn eating-btn" data-type="eating" data-modal="eating-modal">
        <span class="emoji">🍽️</span>
        <span>Eating</span>
      </button>
      <button class="activity-btn groom-btn" data-type="groom" data-modal="groom-modal">
        <span class="emoji">✨</span>
        <span>Groom</span>
      </button>
      <button class="activity-btn surgery-btn" data-type="surgery" data-modal="surgery-modal">
        <span class="emoji">⚕️</span>
        <span>Surgery</span>
      </button>
    </section>

    <!-- Stats -->
    <section class="stats">
      <h2>Summary</h2>
      <div id="stats-grid" class="stats-grid"></div>
    </section>

    <!-- Today's Activities -->
    <section class="activities">
      <h2 id="date-header">Today's Activities</h2>
      <div id="activities-list" class="activities-list">
        <p class="empty-state">No activities logged yet</p>
      </div>
    </section>
    </div>

    <!-- History Page -->
    <div id="history-page" class="page" style="display: none;">
      <section class="activities">
        <h2>Activity History</h2>
        <div id="history-list" class="activities-list">
          <p class="empty-state">No activity history</p>
        </div>
      </section>
    </div>

    <!-- Analytics Page -->
    <div id="analytics-page" class="page" style="display: none;">
      <section class="activities">
        <h2>Calendar</h2>
        <div id="calendar" class="calendar"></div>
      </section>

      <section class="activities">
        <h2>Activity Map</h2>
        <div id="map" class="map-container"></div>
        <div id="map-info" class="map-info" style="display: none;">
          <p id="map-marker-info"></p>
        </div>
      </section>

      <section class="activities">
        <h2>Weekly Overview</h2>
        <div id="weekly-stats" class="weekly-stats"></div>
      </section>
    </div>

    <!-- Date Picker Modal -->
    <div id="date-picker-modal" class="modal">
      <div class="modal-content">
        <h3>Select Date</h3>
        <input type="date" id="date-input">
        <div class="modal-actions">
          <button class="btn btn-secondary" onclick="closeDatePickerModal()">Cancel</button>
          <button class="btn btn-primary" onclick="changeDate()">Go</button>
        </div>
      </div>
    </div>

    <!-- Potty Modal -->
    <div id="potty-modal" class="modal">
      <div class="modal-content">
        <h3>🚽 Log Potty Break</h3>
        <div class="form-group">
          <label>Type:</label>
          <div class="radio-group">
            <label><input type="radio" name="potty-type" value="pee" checked> Pee</label>
            <label><input type="radio" name="potty-type" value="poo"> Poo</label>
            <label><input type="radio" name="potty-type" value="both"> Both</label>
          </div>
        </div>
        <textarea id="potty-notes" placeholder="Notes (optional)"></textarea>
        <label class="checkbox-label">
          <input type="checkbox" id="potty-gps" checked> Include GPS
        </label>
        <div class="modal-actions">
          <button class="btn btn-secondary" onclick="closeModal('potty-modal')">Cancel</button>
          <button class="btn btn-primary" onclick="logActivity('potty')">Log</button>
        </div>
      </div>
    </div>

    <!-- Vomit Modal -->
    <div id="vomit-modal" class="modal">
      <div class="modal-content">
        <h3>🤢 Log Vomiting</h3>
        <textarea id="vomit-notes" placeholder="Notes (optional)"></textarea>
        <label class="checkbox-label">
          <input type="checkbox" id="vomit-gps" checked> Include GPS
        </label>
        <div class="modal-actions">
          <button class="btn btn-secondary" onclick="closeModal('vomit-modal')">Cancel</button>
          <button class="btn btn-primary" onclick="logActivity('vomit')">Log</button>
        </div>
      </div>
    </div>

    <!-- Eating Modal -->
    <div id="eating-modal" class="modal">
      <div class="modal-content">
        <h3>🍽️ Log Eating</h3>
        <textarea id="eating-notes" placeholder="Notes (optional)"></textarea>
        <label class="checkbox-label">
          <input type="checkbox" id="eating-gps" checked> Include GPS
        </label>
        <div class="modal-actions">
          <button class="btn btn-secondary" onclick="closeModal('eating-modal')">Cancel</button>
          <button class="btn btn-primary" onclick="logActivity('eating')">Log</button>
        </div>
      </div>
    </div>

    <!-- Groom Modal -->
    <div id="groom-modal" class="modal">
      <div class="modal-content">
        <h3>✨ Log Grooming</h3>
        <textarea id="groom-notes" placeholder="Notes (optional)"></textarea>
        <label class="checkbox-label">
          <input type="checkbox" id="groom-gps" checked> Include GPS
        </label>
        <div class="modal-actions">
          <button class="btn btn-secondary" onclick="closeModal('groom-modal')">Cancel</button>
          <button class="btn btn-primary" onclick="logActivity('groom')">Log</button>
        </div>
      </div>
    </div>

    <!-- Surgery Modal -->
    <div id="surgery-modal" class="modal">
      <div class="modal-content">
        <h3>⚕️ Log Surgery</h3>
        <textarea id="surgery-notes" placeholder="Notes (optional)"></textarea>
        <label class="checkbox-label">
          <input type="checkbox" id="surgery-gps" checked> Include GPS
        </label>
        <div class="modal-actions">
          <button class="btn btn-secondary" onclick="closeModal('surgery-modal')">Cancel</button>
          <button class="btn btn-primary" onclick="logActivity('surgery')">Log</button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
